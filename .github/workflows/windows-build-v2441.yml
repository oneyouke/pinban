name: Build Windows V2.4.41

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'patches/apply_v2441.py'
      - 'patches/test_v2441_commercial_release.py'
      - '.github/workflows/windows-build-v2441.yml'

permissions:
  contents: read

jobs:
  build-windows-v2441:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', architecture: 'x64'}
      - name: Restore source
        shell: powershell
        run: |
          Expand-Archive -Path 'source/Desktop-Imposer-Pro-V2.2-Performance.zip' -DestinationPath 'build-src' -Force
          $root=Resolve-Path 'build-src/Desktop-Imposer-Pro-V2.2'; "APP_ROOT=$root"|Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Bootstrap patch dependency
        shell: powershell
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Apply patches through V2.4.41
        shell: powershell
        run: |
          $patches=Get-ChildItem 'patches/apply_v*.py'|Where-Object{$_.BaseName -match '^apply_v\d+$'}|Sort-Object{[int]($_.BaseName -replace '\D','')}
          foreach($patch in $patches){& python -B $patch.FullName;if($LASTEXITCODE -ne 0){throw "Patch failed: $($patch.Name)"}}
          $version=python -B -c "import sys;sys.path.insert(0,r'$env:APP_ROOT');import product;print(product.APP_VERSION)"
          if($version.Trim() -ne '2.4.41'){throw "Expected 2.4.41, got $version"}
      - name: Install dependencies
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt
      - name: Patch PySide6 6.11 smoke-test compatibility
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          $path='install_smoke_test.py';$text=Get-Content $path -Raw
          $text=$text.Replace('from PySide6.QtCore import QT_VERSION_STR','from PySide6.QtCore import QLibraryInfo').Replace('print("Qt", QT_VERSION_STR)','print("Qt", QLibraryInfo.version().toString())')
          Set-Content -Path $path -Value $text -Encoding UTF8
      - name: Regression and commercial release gate
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          $env:PYTHONIOENCODING='utf-8';$env:PYTHONUTF8='1';$env:QT_QPA_PLATFORM='offscreen'
          python -B -m compileall -q .
          python -B test_v2440_system_settings.py
          python -B test_v2441_commercial_release.py
          python -B release_gate.py --strict
          python -B install_smoke_test.py
      - name: Build EXE
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT;Remove-Item -Recurse -Force build,dist,release -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Path release -Force|Out-Null
          python -B -m PyInstaller --noconfirm --clean DesktopImposer.spec
          if($LASTEXITCODE -ne 0 -or -not(Test-Path 'dist/DesktopImposerPro/DesktopImposerPro.exe')){throw 'EXE not generated'}
      - name: Optional Authenticode sign application
        shell: powershell
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          Set-Location $env:APP_ROOT
          if([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE)){Write-Host 'No signing certificate configured; artifact will be unsigned.';exit 0}
          $pfx=Join-Path $env:RUNNER_TEMP 'desktop-imposer-signing.pfx'
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          $signtool=(Get-Command signtool.exe -ErrorAction Stop).Source
          & $signtool sign /f $pfx /p $env:WINDOWS_SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 'dist/DesktopImposerPro/DesktopImposerPro.exe'
          if($LASTEXITCODE -ne 0){throw 'Application signing failed'}
          Remove-Item $pfx -Force
      - name: Pack and optionally sign NSIS setup
        shell: powershell
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          choco install nsis -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'NSIS installation failed'}
          $nsis=@("$env:ProgramFiles\NSIS\makensis.exe","${env:ProgramFiles(x86)}\NSIS\makensis.exe")|Where-Object{Test-Path $_}|Select-Object -First 1
          Set-Location $env:APP_ROOT;& $nsis "/DAPP_VERSION=2.4.41" "/DAPP_PUBLISHER=云游客科技" installer_nsis.nsi
          if($LASTEXITCODE -ne 0){throw 'NSIS failed'}
          $setup=Get-ChildItem 'release/DesktopImposerPro-*-Setup-x64.exe'|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          Copy-Item $setup.FullName 'release/Desktop-Imposer-Pro-V2.4.41-Setup-x64.exe' -Force
          if(-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE)){
            $pfx=Join-Path $env:RUNNER_TEMP 'desktop-imposer-signing.pfx';[IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
            $signtool=(Get-Command signtool.exe -ErrorAction Stop).Source;& $signtool sign /f $pfx /p $env:WINDOWS_SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 'release/Desktop-Imposer-Pro-V2.4.41-Setup-x64.exe'
            if($LASTEXITCODE -ne 0){throw 'Installer signing failed'};Remove-Item $pfx -Force
          }
          Get-FileHash 'release/Desktop-Imposer-Pro-V2.4.41-Setup-x64.exe' -Algorithm SHA256|Format-List|Out-File 'release/SHA256.txt'
          python generate_sbom.py
          Copy-Item 'release-sbom.json' 'release/release-sbom.json' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-Imposer-Pro-V2.4.41-Windows-x64
          path: |
            ${{ env.APP_ROOT }}/release/Desktop-Imposer-Pro-V2.4.41-Setup-x64.exe
            ${{ env.APP_ROOT }}/release/SHA256.txt
            ${{ env.APP_ROOT }}/release/release-sbom.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Desktop-Imposer-Pro-V2.4.41-Portable-x64
          path: ${{ env.APP_ROOT }}/dist/DesktopImposerPro/**
          if-no-files-found: error
          retention-days: 30
