name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'patches/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $nsis = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS makensis.exe not found' }
          "NSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore V2.2 source archive
        shell: powershell
        run: |
          $archive = 'source/Desktop-Imposer-Pro-V2.2-Performance.zip'
          if (-not (Test-Path $archive)) { throw 'Missing source archive' }
          Expand-Archive -Path $archive -DestinationPath 'build-src' -Force
          $root = Resolve-Path 'build-src/Desktop-Imposer-Pro-V2.2'
          "APP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply release patches through V2.3.6
        shell: powershell
        run: |
          python -B patches/apply_v221.py
          python -B patches/apply_v222.py
          python -B patches/apply_v230.py
          python -B patches/apply_v231.py
          python -B patches/apply_v232.py
          python -B patches/apply_v233.py
          python -B patches/apply_v234.py
          python -B patches/apply_v235.py
          python -B patches/apply_v236.py
          Remove-Item -Recurse -Force (Join-Path $env:APP_ROOT '__pycache__') -ErrorAction SilentlyContinue

          $version = python -B -c "import sys; sys.path.insert(0, r'$env:APP_ROOT'); import product; print(product.APP_VERSION)"
          if ($version.Trim() -ne '2.3.6') { throw "Expected V2.3.6, got $version" }

          $service = Get-Content (Join-Path $env:APP_ROOT 'production_service.py') -Raw
          if ($service -match 'tmp\.open\("rb"\)') { throw 'Unsafe read-only fsync implementation is still present' }
          if ($service -notmatch 'tmp\.open\("r\+b"\)') { throw 'V2.3.5 Windows writable fsync fix is missing' }

          $backup = Get-Content (Join-Path $env:APP_ROOT 'backup_restore.py') -Raw
          if ($backup -notmatch 'dst\.close\(\)' -or $backup -notmatch 'src\.close\(\)') { throw 'V2.3.6 SQLite close fix is missing' }

      - name: Install build dependencies
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt

      - name: Patch PySide6 smoke-test compatibility
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          $path = 'install_smoke_test.py'
          $text = Get-Content $path -Raw
          $text = $text.Replace('from PySide6.QtCore import QT_VERSION_STR', 'from PySide6.QtCore import QLibraryInfo')
          $text = $text.Replace('print("Qt", QT_VERSION_STR)', 'print("Qt", QLibraryInfo.version().toString())')
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Installation and PDF export smoke tests
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          python -B -m compileall -q .
          python -B -c "import product; assert product.APP_VERSION == '2.3.6', product.APP_VERSION"
          python -B -c "import prepress_center; assert hasattr(prepress_center, 'RulerWidget'); import enhanced_preflight; assert hasattr(enhanced_preflight, 'scan_pdf')"
          python -B test_engine.py
          python -B test_export_v233.py
          python -B install_smoke_test.py

      - name: Build EXE with PyInstaller
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          Remove-Item -Recurse -Force build,dist,release -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path release -Force | Out-Null
          python -B -m PyInstaller --noconfirm --clean DesktopImposer.spec
          if (-not (Test-Path 'dist/DesktopImposerPro/DesktopImposerPro.exe')) { throw 'DesktopImposerPro.exe not generated' }

      - name: Packaging self-test
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          $exe = Resolve-Path 'dist/DesktopImposerPro/DesktopImposerPro.exe'
          $selfTest = Join-Path $env:TEMP 'desktop-imposer-selftest.json'
          Remove-Item $selfTest -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:DESKTOP_IMPOSER_SELFTEST_FILE = $selfTest
          $p = Start-Process -FilePath $exe -ArgumentList '--packaging-self-test' -Wait -PassThru
          Remove-Item Env:DESKTOP_IMPOSER_SELFTEST_FILE -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -or -not (Test-Path $selfTest)) { throw 'Packaged application self-test failed' }
          $data = Get-Content $selfTest -Raw | ConvertFrom-Json
          if (-not $data.ok) { throw 'Qt/PDF packaged self-test returned failure' }

      - name: Pack NSIS Setup
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          $version = python -B -c "import product; print(product.APP_VERSION)"
          if ($version.Trim() -ne '2.3.6') { throw "Refusing to package wrong version: $version" }
          & $env:NSIS "/DAPP_VERSION=$version" "/DAPP_PUBLISHER=Desktop Imposer Pro" installer_nsis.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          $setup = Get-ChildItem 'release/DesktopImposerPro-*-Setup-x64.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw 'Setup-x64.exe not generated' }
          Copy-Item $setup.FullName 'release/Desktop-Imposer-Pro-V2.3.6-Setup-x64.exe' -Force
          Get-FileHash 'release/Desktop-Imposer-Pro-V2.3.6-Setup-x64.exe' -Algorithm SHA256 | Format-List | Out-File 'release/SHA256.txt'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Imposer-Pro-V2.3.6-Windows-x64
          path: |
            ${{ env.APP_ROOT }}/release/Desktop-Imposer-Pro-V2.3.6-Setup-x64.exe
            ${{ env.APP_ROOT }}/release/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Imposer-Pro-V2.3.6-Portable-x64
          path: ${{ env.APP_ROOT }}/dist/DesktopImposerPro/**
          if-no-files-found: error
          retention-days: 30
