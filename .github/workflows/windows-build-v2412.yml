name: Build Windows V2.4.12

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'patches/**'
      - '.github/workflows/windows-build-v2412.yml'

permissions:
  contents: read

jobs:
  build-windows-v2412:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $nsis = @("$env:ProgramFiles\NSIS\makensis.exe", "${env:ProgramFiles(x86)}\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS not found' }
          "NSIS=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore source
        shell: powershell
        run: |
          Expand-Archive -Path 'source/Desktop-Imposer-Pro-V2.2-Performance.zip' -DestinationPath 'build-src' -Force
          $root = Resolve-Path 'build-src/Desktop-Imposer-Pro-V2.2'
          "APP_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install patch bootstrap dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check cryptography
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install cryptography bootstrap dependency' }
      - name: Apply patches through V2.4.12
        shell: powershell
        run: |
          $patches = @(
            'patches/apply_v221.py','patches/apply_v222.py','patches/apply_v230.py','patches/apply_v231.py',
            'patches/apply_v232.py','patches/apply_v233.py','patches/apply_v234.py','patches/apply_v235.py',
            'patches/apply_v236.py','patches/apply_v237.py','patches/apply_v240.py','patches/apply_v241.py',
            'patches/apply_v242.py','patches/apply_v243.py','patches/apply_v244.py','patches/apply_v245.py',
            'patches/apply_v246.py','patches/apply_v247.py','patches/apply_v248.py','patches/apply_v249.py',
            'patches/apply_v2410.py','patches/apply_v2411.py','patches/apply_v2412.py'
          )
          foreach ($patch in $patches) {
            & python -B $patch
            if ($LASTEXITCODE -ne 0) { throw "Patch failed: $patch" }
          }
          $version = python -B -c "import sys; sys.path.insert(0, r'$env:APP_ROOT'); import product; print(product.APP_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Version probe failed' }
          if ($version.Trim() -ne '2.4.12') { throw "Expected 2.4.12, got $version" }
          if (-not (Test-Path (Join-Path $env:APP_ROOT 'batch_queue.py'))) { throw 'batch_queue.py missing' }
      - name: Install dependencies
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          python -m pip install --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw 'pip bootstrap failed' }
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'requirements install failed' }
      - name: Patch smoke-test compatibility
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          $path = 'install_smoke_test.py'
          $text = Get-Content $path -Raw
          $text = $text.Replace('from PySide6.QtCore import QT_VERSION_STR', 'from PySide6.QtCore import QLibraryInfo')
          $text = $text.Replace('print("Qt", QT_VERSION_STR)', 'print("Qt", QLibraryInfo.version().toString())')
          Set-Content -Path $path -Value $text -Encoding UTF8
      - name: Full regression and batch queue tests
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $commands = @(
            @('-B','-m','compileall','-q','.'),
            @('-B','-c',"import product; assert product.APP_VERSION == '2.4.12'"),
            @('-B','test_v240_core.py'), @('-B','test_v241_ui.py'), @('-B','test_v242_ui.py'),
            @('-B','test_v243_duplex.py'), @('-B','test_v244_marks.py'), @('-B','test_v245_production_gate.py'),
            @('-B','test_v246_workspace.py'), @('-B','test_v247_optimizer.py'), @('-B','test_v248_resources.py'),
            @('-B','test_v249_production.py'), @('-B','test_v2410_quote.py'), @('-B','test_v2411_templates.py'),
            @('-B','test_v2412_batch_queue.py'), @('-B','test_engine.py'), @('-B','test_export_v233.py'), @('-B','install_smoke_test.py')
          )
          foreach ($argsList in $commands) {
            & python @argsList
            if ($LASTEXITCODE -ne 0) { throw "Python test failed: $($argsList -join ' ')" }
          }
      - name: Build EXE
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          Remove-Item -Recurse -Force build,dist,release -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path release -Force | Out-Null
          python -B -m PyInstaller --noconfirm --clean DesktopImposer.spec
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (-not (Test-Path 'dist/DesktopImposerPro/DesktopImposerPro.exe')) { throw 'EXE not generated' }
      - name: Packaged self-test
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          $exe = Resolve-Path 'dist/DesktopImposerPro/DesktopImposerPro.exe'
          $selfTest = Join-Path $env:TEMP 'desktop-imposer-selftest-v2412.json'
          Remove-Item $selfTest -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:DESKTOP_IMPOSER_SELFTEST_FILE = $selfTest
          $p = Start-Process -FilePath $exe -ArgumentList '--packaging-self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $selfTest)) { throw 'Packaged self-test failed' }
          $data = Get-Content $selfTest -Raw | ConvertFrom-Json
          if (-not $data.ok -or $data.version -ne '2.4.12') { throw 'Wrong packaged version or self-test failure' }
      - name: Pack NSIS setup
        shell: powershell
        run: |
          Set-Location $env:APP_ROOT
          & $env:NSIS "/DAPP_VERSION=2.4.12" "/DAPP_PUBLISHER=Desktop Imposer Pro" installer_nsis.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS failed' }
          $setup = Get-ChildItem 'release/DesktopImposerPro-*-Setup-x64.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw 'Setup missing' }
          Copy-Item $setup.FullName 'release/Desktop-Imposer-Pro-V2.4.12-Setup-x64.exe' -Force
          Get-FileHash 'release/Desktop-Imposer-Pro-V2.4.12-Setup-x64.exe' -Algorithm SHA256 | Format-List | Out-File 'release/SHA256.txt'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Imposer-Pro-V2.4.12-Windows-x64
          path: |
            ${{ env.APP_ROOT }}/release/Desktop-Imposer-Pro-V2.4.12-Setup-x64.exe
            ${{ env.APP_ROOT }}/release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Imposer-Pro-V2.4.12-Portable-x64
          path: ${{ env.APP_ROOT }}/dist/DesktopImposerPro/**
          if-no-files-found: error
          retention-days: 30
