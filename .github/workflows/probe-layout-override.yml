name: Probe layout override contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-layout-override.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        shell: powershell
        run: |
          Expand-Archive -Path 'source/Desktop-Imposer-Pro-V2.2-Performance.zip' -DestinationPath 'build-src' -Force
      - name: Print layout override contract
        shell: python
        run: |
          from pathlib import Path
          root=Path('build-src/Desktop-Imposer-Pro-V2.2')
          for name in ('imposition.py','production_service.py'):
              p=root/name
              text=p.read_text(encoding='utf-8')
              lines=text.splitlines()
              print(f'===== {name} =====')
              hits=[i for i,line in enumerate(lines) if 'layout_override' in line or 'manual_layout' in line]
              if not hits:
                  print('NO HITS')
                  continue
              shown=set()
              for i in hits:
                  lo=max(0,i-35); hi=min(len(lines),i+70)
                  for j in range(lo,hi):
                      if j not in shown:
                          print(f'{j+1:04d}: {lines[j]}'); shown.add(j)
                  print('-----')
