name: Diagnose GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm hosted runner starts
        run: |
          echo "GitHub-hosted runner started successfully"
          uname -a
