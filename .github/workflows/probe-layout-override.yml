name: Probe layout override contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-layout-override.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore source
        shell: powershell
        run: |
          Expand-Archive -Path 'source/Desktop-Imposer-Pro-V2.2-Performance.zip' -DestinationPath 'build-src' -Force
          New-Item -ItemType Directory -Path 'probe-output' -Force | Out-Null
          Copy-Item 'build-src/Desktop-Imposer-Pro-V2.2/imposition.py' 'probe-output/imposition.py' -Force
          Copy-Item 'build-src/Desktop-Imposer-Pro-V2.2/production_service.py' 'probe-output/production_service.py' -Force
          if (-not (Test-Path 'probe-output/imposition.py')) { throw 'imposition.py missing' }
      - name: Upload source contract files
        uses: actions/upload-artifact@v4
        with:
          name: layout-override-source-contract
          path: probe-output/**
          if-no-files-found: error
          retention-days: 7
